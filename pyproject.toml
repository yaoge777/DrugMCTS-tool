[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drugmcts-tool"
version = "0.1.0"
description = "Drug target hypothesis exploration with molecular retrieval and Monte Carlo tree search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rdkit>=2024.9,<2027", "pydantic>=2.7,<3", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/yaoge777/DrugMCTS-tool"
Paper = "https://arxiv.org/abs/2507.07426"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
hybrid = ["torch>=2.3,<3", "transformers>=4.44,<6"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.12"]

[project.scripts]
drugmcts = "drugmcts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drugmcts = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
